<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Big Daddy Burgers</title>
  <link rel="stylesheet" href="assets/css/style.css" />
</head>
<body>
  <header>
    <h1>🍔 Big Daddy Burgers</h1>
    <button id="cartButton" class="cart-button">🛒 Carrinho (<span id="cartCount">0</span>)</button>
  </header>

  <main>
    <section id="menu" class="menu-container"></section>

    <section id="order" class="order-section">
      <h2>Finalizar Pedido</h2>
      <label for="tableNumber">Número da Mesa:</label>
      <input type="number" id="tableNumber" min="1" placeholder="Ex: 5" />

      <label for="obs">Observações:</label>
      <textarea id="obs" placeholder="Ex: sem cebola, sem sal..."></textarea>

      <div id="cartItems"></div>
      <button id="finalizeOrder">Enviar Pedido ✅</button>
    </section>
  </main>

  <footer>
    <p>© 2025 Big Daddy Burgers - Sabor e atitude!</p>
  </footer>

  <script src="assets/js/utils.js"></script>
  <script src="assets/js/cart.js"></script>
  <script src="assets/js/menu.js"></script>
  <script src="assets/js/order.js"></script>
</body>
</html>
